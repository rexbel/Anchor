# Anchor on one box: the app plus MongoDB. The reasoning model, Kokoro, and
# OpenClaw run as the GB10's own services; point the env vars below at them.
services:
  anchor:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: anchor
      ANCHOR_LLM_BASE_URL: ${ANCHOR_LLM_BASE_URL:-}
      ANCHOR_LLM_MODEL: ${ANCHOR_LLM_MODEL:-qwen-3.8-27b}
      ANCHOR_TTS_BASE_URL: ${ANCHOR_TTS_BASE_URL:-}
      ANCHOR_TTS_VOICE: ${ANCHOR_TTS_VOICE:-af_heart}
      # Set by the "twin" profile below; empty means no Digital Twin cloning.
      ANCHOR_TWIN_TTS_URL: ${ANCHOR_TWIN_TTS_URL:-}
      # Optional demo voice: a consented reference mounted on the box (see README).
      ANCHOR_DEMO_TWIN_WAV: ${ANCHOR_DEMO_TWIN_WAV:-}
      ANCHOR_DEMO_TWIN_TEXT: ${ANCHOR_DEMO_TWIN_TEXT:-}
      ANCHOR_DEMO_TWIN_PATIENT: ${ANCHOR_DEMO_TWIN_PATIENT:-}
      ANCHOR_DEMO_TWIN_CONSENTED_BY: ${ANCHOR_DEMO_TWIN_CONSENTED_BY:-}
      OPENCLAW_HOOK_URL: ${OPENCLAW_HOOK_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      ANCHOR_DEMO_MODE: ${ANCHOR_DEMO_MODE:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - anchor-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Digital Twin voice cloning. Opt in:
  #   ANCHOR_TWIN_TTS_URL=http://twin-tts:8020/twin docker compose --profile twin up -d --build
  # Default engine: Sesame CSM-1B (Apache-2.0). Put the weights in the twin-models
  # volume and set TWIN_CSM_MODEL=/models/sesame-csm-1b, or set HF_TOKEN (the
  # model is gated on Hugging Face). TWIN_ENGINE=xtts also needs COQUI_TOS_AGREED=1.
  twin-tts:
    profiles: ["twin"]
    build: ./services/twin-tts
    environment:
      TWIN_ENGINE: ${TWIN_ENGINE:-csm}
      TWIN_CSM_MODEL: ${TWIN_CSM_MODEL:-sesame/csm-1b}
      HF_TOKEN: ${HF_TOKEN:-}
      COQUI_TOS_AGREED: ${COQUI_TOS_AGREED:-}
      TWIN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - twin-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  anchor-mongo:
  twin-models:
